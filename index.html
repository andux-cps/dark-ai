
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #a855f7;
  letter-spacing: 2px;
}

.status {
  color: #22c55e;
  font-size: 12px;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 25px 16px;
}

.welcome {
  text-align: center;
  margin: 65px 0 35px;
}

.welcome h1 {
  font-size: 34px;
  margin-bottom: 12px;
  background: linear-gradient(90deg,#9333ea,#3b82f6);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: #888;
}

#chat {
  min-height: 300px;
  padding-bottom: 100px;
}

.message {
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  background: #25113b;
  margin-left: 35px;
}

.bot {
  background: #171717;
  border: 1px solid #333;
  margin-right: 20px;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 15px;
  background: #080808;
  border-top: 1px solid #222;
}

.input-box {
  display: flex;
  max-width: 750px;
  margin: auto;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  background: #181818;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 15px;
  color: white;
  outline: none;
}

button {
  background: #9333ea;
  border: none;
  color: white;
  padding: 0 20px;
  border-radius: 12px;
  font-weight: bold;
}

button:active {
  background: #6b21a8;
}

.footer {
  text-align: center;
  color: #555;
  font-size: 11px;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">◈ DARK AI</div>
  <div class="status">● ONLINE</div>
</header>

<main>
  <div class="welcome" id="welcome">
    <h1>WELCOME TO DARK AI</h1>
    <p>Beyond Intelligence. Beyond Limits.</p>
  </div>

  <div id="chat"></div>
</main>

<div class="input-area">
  <div class="input-box">
    <input id="prompt" type="text"
      placeholder="Tanyakan sesuatu kepada DARK AI..."
      onkeydown="if(event.key==='Enter')sendMessage()">

    <button onclick="sendMessage()">KIRIM</button>
  </div>
  <div class="footer">
    DARK AI © 2026 | AI Interface Demo
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("prompt");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();
  if (!text) return;

  welcome.style.display = "none";

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = text;
  chat.appendChild(user);

  const bot = document.createElement("div");
  bot.className = "message bot";
  bot.textContent =
    "Halo! Saya DARK AI. Tampilan AI berhasil dibuat. Untuk memberikan jawaban AI sungguhan, hubungkan aplikasi ini ke API AI melalui backend yang aman.";
  chat.appendChild(bot);

  input.value = "";
  window.scrollTo(0, document.body.scrollHeight);
}
</script>

</body>
</html>
